<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盛夏 剩下</title>
  <meta name="description" content="李一帆、杨汝、黄凯君、钟倩倩的毕业照片记录">
  <link rel="stylesheet" href="style.css?v=20260609b">
  <style>
    .home-hero {
      --hero-image: url("backgrounds/home.jpg");
      --hero-x: 50%;
      --hero-y: 50%;
      min-height: 82vh;
      align-items: center;
      padding: 28px;
      background-image:
        linear-gradient(90deg, rgba(7, 18, 24, 0.78), rgba(7, 18, 24, 0.36) 42%, rgba(7, 18, 24, 0.08)),
        linear-gradient(180deg, rgba(7, 18, 24, 0), rgba(7, 18, 24, 0.54)),
        var(--hero-image);
      background-size: auto, auto, contain;
      background-position: center, center, var(--hero-x) var(--hero-y);
      background-color: #dfeef7;
      transition: background-position 180ms ease-out;
    }

    .home-hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 120px;
      background: linear-gradient(180deg, rgba(251, 253, 255, 0), #fbfdff);
      pointer-events: none;
    }

    .home-hero .hero-inner {
      display: grid;
      gap: 18px;
      padding: 0;
      animation: heroReveal 900ms ease both;
    }

    .home-hero .eyebrow {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      color: rgba(255, 255, 255, 0.92);
      text-transform: none;
    }

    .home-hero .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #f1b84b;
      box-shadow: 0 0 0 6px rgba(241, 184, 75, 0.16);
    }

    .home-hero h1 {
      max-width: 740px;
      font-size: clamp(54px, 10vw, 112px);
      letter-spacing: 0;
    }

    .home-hero .lead {
      max-width: 700px;
      margin: 0;
      padding-left: 18px;
      border-left: 3px solid rgba(241, 184, 75, 0.9);
      color: rgba(255, 255, 255, 0.94);
    }

    .scroll-cue {
      position: absolute;
      left: 50%;
      bottom: 30px;
      z-index: 3;
      display: inline-grid;
      grid-template-columns: auto 18px;
      gap: 10px;
      align-items: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.9);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(14px);
      transform: translateX(-50%);
      animation: cueFloat 1800ms ease-in-out infinite;
    }

    .scroll-cue::after {
      content: "";
      width: 8px;
      height: 8px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: translateY(-2px) rotate(45deg);
    }

    .home-main {
      position: relative;
      margin-top: -40px;
      padding-top: 0;
    }

    .home-intro {
      align-items: center;
      padding: 22px 0 24px;
      animation: riseIn 740ms ease 180ms both;
    }

    .home-intro h2 {
      font-size: clamp(30px, 4.6vw, 52px);
    }

    .people-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      align-items: stretch;
    }

    .person-card {
      --glow-x: 50%;
      --glow-y: 50%;
      min-height: 390px;
      border: 0;
      border-radius: 8px;
      box-shadow: 0 18px 54px rgba(36, 68, 82, 0.16);
      isolation: isolate;
      opacity: 1;
      transform: none;
      animation: riseIn 720ms ease backwards;
      transition: transform 220ms ease, box-shadow 220ms ease, filter 220ms ease;
    }

    .person-card:nth-child(1) {
      animation-delay: 260ms;
    }

    .person-card:nth-child(2) {
      animation-delay: 360ms;
    }

    .person-card:nth-child(3) {
      animation-delay: 460ms;
    }

    .person-card:nth-child(4) {
      animation-delay: 560ms;
    }

    .person-card::before {
      content: attr(data-index);
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      backdrop-filter: blur(12px);
    }

    .person-card::after {
      background:
        radial-gradient(circle at var(--glow-x) var(--glow-y), rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0) 24%),
        linear-gradient(180deg, rgba(7, 19, 24, 0) 38%, rgba(7, 19, 24, 0.72)),
        linear-gradient(120deg, rgba(7, 19, 24, 0.38), rgba(7, 19, 24, 0) 46%);
      opacity: 0.96;
      transition: opacity 220ms ease;
    }

    .person-card img {
      min-height: 390px;
    }

    .person-card span {
      bottom: 24px;
      font-size: 28px;
    }

    .person-card span::after {
      content: "进入相册";
      display: block;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.78);
    }

    .person-card:hover,
    .person-card:focus-visible {
      box-shadow: 0 26px 70px rgba(36, 68, 82, 0.23);
      transform: translateY(-6px);
    }

    .person-card:focus-visible {
      outline: 3px solid rgba(241, 184, 75, 0.8);
      outline-offset: 4px;
    }

    .person-card.is-entering {
      filter: brightness(1.06) saturate(1.08);
      transform: translateY(-4px) scale(0.985);
    }

    .home-memory {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      margin-top: 26px;
      padding: 18px 0 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      animation: riseIn 720ms ease 660ms both;
    }

    .home-memory strong {
      color: var(--ink);
    }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 10px;
    }

    .album-card {
      position: relative;
      display: grid;
      min-height: 210px;
      align-content: end;
      overflow: hidden;
      padding: 22px;
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      box-shadow: 0 18px 54px rgba(36, 68, 82, 0.16);
      isolation: isolate;
      animation: riseIn 720ms ease backwards;
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .album-card:nth-child(1) {
      animation-delay: 680ms;
    }

    .album-card:nth-child(2) {
      animation-delay: 760ms;
    }

    .album-card:nth-child(3) {
      animation-delay: 840ms;
    }

    .album-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image:
        linear-gradient(135deg, rgba(7, 18, 24, 0.58), rgba(7, 18, 24, 0.18)),
        var(--album-image);
      background-size: cover;
      background-position: center;
      transition: transform 260ms ease, filter 260ms ease;
    }

    .album-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(7, 19, 24, 0.04), rgba(7, 19, 24, 0.7)),
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0) 30%);
    }

    .album-card:hover,
    .album-card:focus-visible {
      transform: translateY(-6px);
      box-shadow: 0 26px 70px rgba(36, 68, 82, 0.23);
    }

    .album-card:hover::before,
    .album-card:focus-visible::before {
      filter: saturate(1.08) brightness(1.04);
      transform: scale(1.035);
    }

    .album-card strong {
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.34);
    }

    .album-card span {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.82);
    }

    @keyframes heroReveal {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cueFloat {
      0%, 100% {
        transform: translate(-50%, 0);
      }
      50% {
        transform: translate(-50%, -7px);
      }
    }

    @media (max-width: 1000px) {
      .people-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .album-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .home-hero {
        min-height: 76vh;
        align-items: end;
        padding: 20px;
        background-image:
          linear-gradient(180deg, rgba(7, 18, 24, 0.1), rgba(7, 18, 24, 0.74)),
          var(--hero-image);
        background-size: auto, contain;
        background-position: center, center;
        background-color: #dfeef7;
      }

      .home-main {
        margin-top: 0;
      }

      .home-intro {
        padding-top: 34px;
      }

      .people-grid {
        grid-template-columns: 1fr;
      }

      .album-grid {
        grid-template-columns: 1fr;
      }

      .person-card,
      .person-card img {
        min-height: 360px;
      }

      .album-card {
        min-height: 190px;
      }

      .home-memory {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .home-hero,
      .home-hero .hero-inner,
      .home-intro,
      .person-card,
      .album-card,
      .home-memory,
      .scroll-cue {
        animation: none;
        transition: none;
      }

      .person-card {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <header class="home-hero">
    <div class="hero-inner">
      <p class="eyebrow">2026 / Graduation</p>
      <h1>盛夏 剩下</h1>
      <p class="lead">打动我的文字，要么短暂，却有大片留白；要么细腻，细腻到写尽所有。
就像现在，我们真实地看见彼此，多年以后再回头，却只剩下盛夏。</p>
    </div>
    <button class="scroll-cue" type="button" data-scroll-target="#people-title">看相册</button>
  </header>

  <main class="home-main">
    <section class="home-intro" aria-labelledby="people-title">
      <h2 id="people-title">选择一个人物</h2>
      <p>每个人都有自己的照片、音乐和毕业瞬间。点进名字，慢慢看。</p>
    </section>

    <section class="people-grid" aria-label="人物入口">
      <a class="person-card" href="people/person-1.html" data-index="01">
        <img src="photos/liyi/1.jpg" alt="李一帆封面">
        <span>李一帆</span>
      </a>
      <a class="person-card" href="people/person-2.html" data-index="02">
        <img src="photos/yangru/1.jpg" alt="杨汝封面">
        <span>杨汝</span>
      </a>
      <a class="person-card" href="people/person-3.html" data-index="03">
        <img src="photos/huangkaijun/1.jpg" alt="黄凯君封面">
        <span>黄凯君</span>
      </a>
      <a class="person-card" href="people/person-4.html" data-index="04">
        <img src="photos/zqq/1.jpg" alt="钟倩倩封面">
        <span>钟倩倩</span>
      </a>
    </section>

    <section class="home-memory" aria-label="毕业记录说明">
      <p><strong>四个人，四段独立的页面。</strong>把照片、音乐和那天的光线分开保存，点进去就像翻到一本相册里的某一页。</p>
      <p>Wuhan University · 2026</p>
    </section>

    <section class="home-intro" aria-labelledby="albums-title">
      <h2 id="albums-title">更多板块</h2>
      <p>把集体、寝室和男生们的照片单独放在这里，后续可以继续扩展。</p>
    </section>

    <section class="album-grid" aria-label="主题板块入口">
      <a class="album-card" href="albums/504.html" style="--album-image: url('backgrounds/home.jpg')">
        <strong>504</strong>
        <span>进入主题相册</span>
      </a>
      <a class="album-card" href="albums/women.html" style="--album-image: url('backgrounds/home.jpg')">
        <strong>我们</strong>
        <span>进入主题相册</span>
      </a>
      <a class="album-card" href="albums/boy.html" style="--album-image: url('backgrounds/home.jpg')">
        <strong>boy</strong>
        <span>进入主题相册</span>
      </a>
    </section>
  </main>

  <footer>
    盛夏未完，故事继续。
  </footer>
  <script>
    (() => {
      const motionOk = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const hero = document.querySelector(".home-hero");
      const cue = document.querySelector("[data-scroll-target]");
      const cards = document.querySelectorAll(".person-card");

      if (cue) {
        cue.addEventListener("click", () => {
          document.querySelector(cue.dataset.scrollTarget)?.scrollIntoView({
            behavior: motionOk ? "smooth" : "auto",
            block: "start"
          });
        });
      }

      if (motionOk && hero && window.matchMedia("(pointer: fine)").matches) {
        hero.addEventListener("pointermove", (event) => {
          const rect = hero.getBoundingClientRect();
          const x = 50 + ((event.clientX - rect.left) / rect.width - 0.5) * 5;
          const y = 50 + ((event.clientY - rect.top) / rect.height - 0.5) * 5;
          hero.style.setProperty("--hero-x", `${x}%`);
          hero.style.setProperty("--hero-y", `${y}%`);
        });

        hero.addEventListener("pointerleave", () => {
          hero.style.setProperty("--hero-x", "50%");
          hero.style.setProperty("--hero-y", "50%");
        });
      }

      cards.forEach((card) => {
        card.addEventListener("pointermove", (event) => {
          const rect = card.getBoundingClientRect();
          const x = ((event.clientX - rect.left) / rect.width) * 100;
          const y = ((event.clientY - rect.top) / rect.height) * 100;
          card.style.setProperty("--glow-x", `${x}%`);
          card.style.setProperty("--glow-y", `${y}%`);
        });

        card.addEventListener("click", (event) => {
          if (!motionOk || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          card.classList.add("is-entering");
          window.setTimeout(() => {
            window.location.href = card.href;
          }, 150);
        });
      });
    })();
  </script>
</body>
</html>
