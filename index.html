<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盛夏 剩下</title>
  <meta name="description" content="李一帆、杨汝、黄凯君的毕业照片记录">
  <link rel="stylesheet" href="style.css">
  <style>.home-hero { --hero-image: url("backgrounds/home.jpg"); }</style>
</head>
<body>
  <header class="home-hero">
    <div class="hero-inner">
      <p class="eyebrow">2026 / Graduation</p>
      <h1>我们毕业了</h1>
      <p class="lead">打动我的文字，
要么短暂，却有大片留白；
要么细腻，细腻到写尽所有。
就像现在。
我真实地看见了所有，
多年以后再回头，
却只剩下盛夏。</p>
    </div>
  </header>

  <main class="home-main">
    <section class="home-intro" aria-labelledby="people-title">
      <h2 id="people-title">选择一个人物</h2>
      <p>现在先放三个人物。后续要加人时，再复制一个人物页和一组照片文件夹即可。</p>
    </section>

    <section class="people-grid" aria-label="人物入口">
      <a class="person-card" href="people/person-1.html">
        <img src="photos/section-1/1.jpg" alt="李一帆封面">
        <span>李一帆</span>
      </a>
      <a class="person-card" href="people/person-2.html">
        <img src="photos/section-2/1.jpg" alt="杨汝封面">
        <span>杨汝</span>
      </a>
      <a class="person-card" href="people/person-3.html">
        <img src="photos/section-3/1.jpg" alt="黄凯君封面">
        <span>黄凯君</span>
      </a>
    </section>
  </main>

  <footer>
    Powered by GitHub Pages
  </footer>
</body>
</html>
