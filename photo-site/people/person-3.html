<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>黄凯君</title>
  <meta name="description" content="黄凯君的毕业照片和视频记录">
  <link rel="stylesheet" href="../style.css">
  <style>.person-hero { --hero-image: url("../backgrounds/person-3.png"); }</style>
</head>
<body>
  <header class="person-hero">
    <img class="hero-bg" src="../backgrounds/person-3.png" alt="">
    <div class="hero-inner">
      <p class="eyebrow">Person 03</p>
      <h1>黄凯君</h1>
      <p class="lead">毕业照里的每一次注视，都像给青春留下的一页书签。</p>
    </div>
  </header>

  <nav class="top-nav" aria-label="页面导航">
    <a href="../index.html">返回首页</a>
    <a href="person-2.html">上一个人物</a>
  </nav>

  <main class="person-main">
    <section aria-labelledby="person-title">
      <div class="section-title">
        <h2 id="person-title">照片和视频</h2>
        <p class="note">点击照片可以放大查看；视频位先保留，后面可以继续上传。</p>
      </div>

      <div class="person-grid">
        <div class="gallery">
          <a class="tile" href="../photos/section-3/1.jpg" data-gallery-item data-caption="黄凯君照片 1"><img src="../photos/section-3/1.jpg" alt="黄凯君照片 1"><span>照片 1</span></a>
          <a class="tile" href="../photos/section-3/2.jpg" data-gallery-item data-caption="黄凯君照片 2"><img src="../photos/section-3/2.jpg" alt="黄凯君照片 2"><span>照片 2</span></a>
          <a class="tile" href="../photos/section-3/3.jpg" data-gallery-item data-caption="黄凯君照片 3"><img src="../photos/section-3/3.jpg" alt="黄凯君照片 3"><span>照片 3</span></a>
        </div>
        <div class="video-card">
          <video controls preload="metadata" poster="../videos/section-3/poster.svg"><source src="../videos/section-3/your-video.mp4" type="video/mp4"></video>
          <p class="story">这里后续可以放黄凯君的视频，或者写一段更完整的毕业寄语。</p>
        </div>
      </div>
    </section>
  </main>

  <footer>Powered by GitHub Pages</footer>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="照片预览">
    <button class="lightbox-close" type="button" aria-label="关闭">&times;</button>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="上一张">&lsaquo;</button>
    <figure><img id="lightboxImage" src="" alt=""><figcaption class="lightbox-caption" id="lightboxCaption"></figcaption></figure>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="下一张">&rsaquo;</button>
  </div>
  <script src="../gallery.js"></script>
</body>
</html>
